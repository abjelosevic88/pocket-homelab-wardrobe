# Pocket Wardrobe (Go + SQLite) — your clothes with photos, outfits for your style and the weather, packing and what is worth buying. One container, one volume.
services:
  pocket-wardrobe:
    image: ghcr.io/abjelosevic88/pocket-homelab-wardrobe:latest
    container_name: pocket-wardrobe
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # Pocket Core: one sign-in, Pocket AI, and posts from Travel/Places/Bookshelf/Kitchen/Notes through app links.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
